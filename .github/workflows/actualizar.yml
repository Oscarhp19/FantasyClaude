name: Actualizar panel

on:
  schedule:
    # De dia, cada 5 minutos, el minimo que admite GitHub. Las horas van en UTC:
    # 6-22 UTC son de 8:00 a 0:59 en Espana en horario de verano (en invierno,
    # una hora antes).
    - cron: "*/5 6-22 * * *"
    # De noche nadie mira el mercado cada 5 minutos: cada media hora, y en
    # minutos que no son redondos.
    - cron: "17,47 23,0-5 * * *"
  workflow_dispatch: {}   # y a mano desde la pestana Actions

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # para borrar los estados viejos de la cache

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Esperar un rato al azar
        # El cron dispara siempre en los mismos minutos; asi las llamadas a
        # LaLiga no caen nunca a la hora exacta.
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 100 ))

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyNaCl
        # La unica dependencia del proyecto, y solo para cifrar el estado.
        run: python -m pip install --quiet pynacl

      - name: Recuperar el estado del pase anterior
        uses: actions/cache/restore@v4
        with:
          path: estado.bin
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - name: Abrir el estado
        env:
          LALIGA_PASSWORD: ${{ secrets.LALIGA_PASSWORD }}
          RUTA_SECRETA: ${{ secrets.RUTA_SECRETA }}
        run: python estado_ci.py abre

      - name: Sesion en LaLiga
        # Reutiliza la sesion guardada; la contrasena solo se usa si ya no vale.
        env:
          LALIGA_EMAIL: ${{ secrets.LALIGA_EMAIL }}
          LALIGA_PASSWORD: ${{ secrets.LALIGA_PASSWORD }}
        run: python laliga_auth.py asegura

      - name: Generar el panel
        run: |
          python sync.py
          python informe.py
          python vista.py

      - name: Montar el sitio
        env:
          RUTA: ${{ secrets.RUTA_SECRETA }}
        run: |
          if [ -z "$RUTA" ]; then
            echo "Falta el secreto RUTA_SECRETA" >&2
            exit 1
          fi
          mkdir -p "sitio/$RUTA"
          cp vista_local.html "sitio/$RUTA/index.html"
          # La raiz no lleva nada: quien pruebe el dominio a secas no ve la liga.
          printf '<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>No hay nada aqui</title>' > sitio/index.html
          printf 'User-agent: *\nDisallow: /\n' > sitio/robots.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

      # Lo que sigue va con always(): si el pase falla despues de renovar la
      # sesion, hay que guardar la sesion nueva o el siguiente tendria una caducada.
      - name: Cerrar el estado
        if: always()
        env:
          LALIGA_PASSWORD: ${{ secrets.LALIGA_PASSWORD }}
          RUTA_SECRETA: ${{ secrets.RUTA_SECRETA }}
        run: python estado_ci.py cierra

      - name: Guardar el estado
        if: always() && hashFiles('estado.bin') != ''
        uses: actions/cache/save@v4
        with:
          path: estado.bin
          key: estado-${{ github.run_id }}

      - name: Borrar estados viejos
        # Cada pase guarda uno nuevo; se conservan los tres ultimos.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key estado- --sort created_at --order desc \
            --limit 100 --json id --jq '.[3:][].id' \
            | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
